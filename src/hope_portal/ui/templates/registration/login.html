{% extends "layout.html" %}
{% load i18n static %}
{% block menu %}
{% endblock menu %}
{% block page %}
    {% if config.LOGIN_LOCAL %}
        <form method="post" class="w-full">
            <div class="flex flex-col justify-center items-center px-4 py-10">
                {% csrf_token %}
                <fieldset class="fieldset bg-base-100 border-base-300 rounded-box w-full max-w-md border p-6 shadow-sm">
                    <legend class="fieldset-legend">
                        {% trans "Login" %}
                    </legend>
                    <label class="label">
                        {{ form.username.label }}
                    </label>
                    <input type="text" class="input w-full" placeholder="{% trans "email address" %}" name="{{ form.username.name }}" />
                    <label class="label">
                        {% trans "Password" %}
                    </label>
                    <input type="password" class="input w-full" placeholder="{% trans "your password" %}" name="{{ form.password.name }}" />
                    <div class="m-auto mt-2">
                        <input type="submit" class="btn btn-primary min-w-32" value="{% trans "Login" %}" />
                    </div>
                </fieldset>
            </div>
        </form>
    {% endif %}
    {% if config.LOGIN_SSO %}
        <div class="flex flex-col justify-center items-center my-4">
            <div class="m-auto">
                <a class="btn btn-primary" href="{% url "social:begin" "azuread-tenant-oauth2" %}">{% trans "Login with Azure" %}</a>
            </div>
        </div>
    {% endif %}
{% endblock page %}
