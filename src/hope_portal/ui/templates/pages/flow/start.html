{% extends "pages/flow/_base.html" %}
{% load i18n %}
{% block page %}
    <div class="flex flex-col justify-center items-center">
        <div class="m-auto w-1/2 border-2 dark:border-gray-200 border-b-gray-900 rounded-2xl  items-center p-5 my-10">
            <form method="POST" action="." id="reg-form">
                {% csrf_token %}
                {{ formset.management_form }}
                <fieldset class="form-group">
                    {{ form }}
                </fieldset>
                <div class="m-auto text-center">
                    <input type="submit" class="btn btn-primary" value="{% trans "Validate" %}" />
                </div>
            </form>
        </div>
    </div>
{% endblock page %}
