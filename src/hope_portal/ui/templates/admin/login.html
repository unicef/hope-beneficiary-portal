{% extends "admin/login.html" %}
{% block extrahead %}
    {{ block.super }}
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var next = new URLSearchParams(window.location.search).get("next");
            if (!next) {
                return;
            }
            document.querySelectorAll('a[href*="azuread-tenant-oauth2"]').forEach(function (link) {
                var url = new URL(link.href, window.location.origin);
                if (!url.searchParams.has("next")) {
                    url.searchParams.set("next", next);
                    link.href = url.pathname + url.search + url.hash;
                }
            });
            // social:begin only accepts POST, so the SSO button may be rendered as a form
            document.querySelectorAll('form[action*="azuread-tenant-oauth2"]').forEach(function (form) {
                if (form.querySelector('input[name="next"]')) {
                    return;
                }
                var input = document.createElement("input");
                input.type = "hidden";
                input.name = "next";
                input.value = next;
                form.appendChild(input);
            });
        });
    </script>
{% endblock %}
